services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: citypulse
      POSTGRES_USER: citypulse
      POSTGRES_PASSWORD: citypulse
    ports: ["5432:5432"]
    volumes: [citypulse_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U citypulse -d citypulse"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://citypulse:citypulse@db:5432/citypulse
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  citypulse_pgdata:
